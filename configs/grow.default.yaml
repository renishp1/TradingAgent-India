# Grow default configuration — milestone 1.
# Execution mode is paper. Any other mode is a boot-time error.

grow:
  version: "0.1.0"
  timezone: "Asia/Kolkata"

  execution:
    mode: paper
    live_trading_enabled: false

  market:
    exchange: NSE
    currency: INR
    session_open: "09:15"
    session_close: "15:30"
    square_off: "15:15"
    product: CASH
    universe:
      - RELIANCE
      - TCS
      - HDFCBANK
      - INFY
      - ICICIBANK
      - SBIN
      - BHARTIARTL
      - ITC
      - LT
      - HINDUNILVR

  risk:
    max_position_notional: 100000
    max_gross_notional: 300000
    max_daily_loss: 15000
    require_stop_loss: true
    max_symbol_concentration: 0.35
    ruleset: "grow.risk.v1"
    allow_short: false
    concentration_basis: cost_notional

  paper:
    starting_cash: 1000000
    venue_id: GROW_PAPER

  model:
    provider: mock
    deep_model: mock-deep
    fast_model: mock-fast
    max_output_tokens: 1024

  tradingagents:
    enabled: true
    max_debate_rounds: 1
    max_risk_discuss_rounds: 1

  data:
    provider: fixture
    allow_live_feed: false
    allow_options_chain: false
    stale_after_seconds: 900
    history_sessions: 20
    timeframes:
      - D1
      - M15
      - M5

  strategies:
    universe:
      - NIFTY
      - BANKNIFTY
    primary_timeframe: M15
    supported_timeframes:
      - M5
      - M15
      - D1
    ema_trend:
      enabled: true
      version: v1
      fast_period: 20
      slow_period: 50
      atr_period: 14
    momentum:
      enabled: true
      version: v1
      rsi_period: 14
      rsi_threshold: 55
      roc_period: 10
      atr_period: 14
    breakout:
      enabled: true
      version: v1
      lookback: 20
      atr_period: 14
    mean_reversion:
      enabled: true
      version: v1
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      deviation: 0.01
      atr_period: 14

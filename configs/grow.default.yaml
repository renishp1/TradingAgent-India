# Grow default configuration — milestone 1.
# Execution mode is paper. Any other mode is a boot-time error.

grow:
  version: "0.1.0"
  timezone: "Asia/Kolkata"

  execution:
    mode: paper
    live_trading_enabled: false

  market:
    exchange: NSE
    currency: INR
    session_open: "09:15"
    session_close: "15:30"
    square_off: "15:15"
    product: CASH
    universe:
      - RELIANCE
      - TCS
      - HDFCBANK
      - INFY
      - ICICIBANK
      - SBIN
      - BHARTIARTL
      - ITC
      - LT
      - HINDUNILVR

  risk:
    max_position_notional: 100000
    max_gross_notional: 300000
    max_daily_loss: 15000
    require_stop_loss: true
    max_symbol_concentration: 0.35
    ruleset: "grow.risk.v1"
    allow_short: false
    concentration_basis: cost_notional

  paper:
    starting_cash: 1000000
    venue_id: GROW_PAPER

  model:
    provider: mock
    deep_model: mock-deep
    fast_model: mock-fast
    max_output_tokens: 1024

  tradingagents:
    enabled: true
    max_debate_rounds: 1
    max_risk_discuss_rounds: 1

  data:
    provider: fixture
    allow_live_feed: false
    allow_options_chain: false
    stale_after_seconds: 900
    history_sessions: 20
    timeframes:
      - D1
      - M15
      - M5

  strategies:
    universe:
      - NIFTY
      - BANKNIFTY
    primary_timeframe: M15
    supported_timeframes:
      - M5
      - M15
      - D1
    ema_trend:
      enabled: true
      version: v1
      fast_period: 20
      slow_period: 50
      atr_period: 14
    momentum:
      enabled: true
      version: v1
      rsi_period: 14
      rsi_threshold: 55
      roc_period: 10
      atr_period: 14
    breakout:
      enabled: true
      version: v1
      lookback: 20
      atr_period: 14
    mean_reversion:
      enabled: true
      version: v1
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      deviation: 0.01
      atr_period: 14

  options:
    enabled: true
    provider: fixture
    allow_live_chain: false
    selection_version: options.select.v1
    freshness:
      max_chain_age_minutes: 5
      max_quote_age_minutes: 5
    expiry:
      allow_same_day: false
      preferred_expiry_class: weekly
    strikes:
      max_distance_from_atm: 2
      allowed_moneyness:
        - ATM
        - ITM
        - OTM
    liquidity:
      min_volume: 100
      min_open_interest: 500
      max_spread_pct: 0.08
    iv:
      min: 0.05
      max: 2.0
    scoring:
      version: v1
    safety:
      reject_stale_chain: true
      reject_invalid_quotes: true

  ai:
    enabled: true
    provider: fixture
    deterministic_mode: true
    max_retries: 0
    timeout_seconds: 30
    confidence:
      enabled: false
      min_ceo_confidence: 0.0
    prompt_versions:
      bull: v1
      bear: v1
      quant: v1
      risk_context: v1
      ceo: v1
    safety:
      paper_only: true
      allow_broker: false
      allow_live_trading: false
      allow_ai_execution: false

  backtest:
    enabled: true
    provider: fixture
    fill_model: ask_plus_slippage
    slippage_bps: 10
    strict: true
    quantity: 1
    lot_size: 1
    max_open_positions: 1
    starting_cash: 1000000
    cost_model_version: costs.india.fn_o.v1
    slippage_model_version: slip.ask.v1
    walk_forward:
      train_sessions: 6
      validate_sessions: 2
      test_sessions: 2
      step_sessions: 2
      embargo_sessions: 1
      calibrate_on_test: false

  research_director:
    enabled: true
    provider: fixture
    deterministic_mode: true
    allow_plan_creation: true
    allow_plan_freeze: true
    allow_result_review: true
    test_visibility:
      blind_until_frozen: true
    permissions:
      broker: false
      live_trading: false
      paper_execution: false
      ledger_write: false
      risk_config_write: false

  research_governance:
    require_approved_dataset: true
    require_versioned_config: true
    require_acceptance_rules: true
    require_test_freeze: true
    reject_test_window_tuning: true

  live_data:
    enabled: false
    provider: mock
    max_staleness_seconds: 30
    reconnect_policy: fail_closed
    session_timeout_seconds: 30
    snapshot_interval_seconds: 60
    require_option_chain: true
    paper_mode: true
    live_trading: false
    quantity: 1
    # allowed_underlyings omitted: discover from the provider, overlay 2I